name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch; tests use a fake embedder and download no models)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy
      - name: pylint
        run: pylint --fail-under=10 fewshot tests
      - name: pytest with coverage (fails under 100%)
        run: pytest -q --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tsc
        run: npm run typecheck
      - name: eslint + stylelint
        run: npm run lint
      - name: build
        run: npm run build
