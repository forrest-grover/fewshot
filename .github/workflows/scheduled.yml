name: Scheduled

# Weekly, and on demand: the checks against the newest releases of every dependency (CI itself
# uses constraints.txt, so an upstream release can't turn it red), and smoke tests of real models.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install the newest versions (no constraints)
        run: |
          pip install --no-deps torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip list
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy
      - name: pylint
        run: pylint --fail-under=10 fewshot tests
      - name: pytest
        run: pytest -q --cov --cov-report=term-missing

  latest-web-dependencies:
    # The UI's checks with the newest releases its package.json allows, instead of package-lock.json's.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
      - name: Install the newest versions (no lock file)
        run: |
          rm package-lock.json
          npm install
          npm ls --depth=0
      - name: tsc
        run: npm run typecheck
      - name: eslint + stylelint
        run: npm run lint
      - name: vitest
        run: npm test
      - name: build
        run: npm run build

  real-models:
    # The opt-in @pytest.mark.model tests: every preset loads and embeds an image and a text for
    # real, with the pinned dependencies and with the newest ones (an open_clip, timm or
    # transformers release that breaks loading a preset shows up here).
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a stalled model download would otherwise hold the runner for 6 hours
    strategy:
      fail-fast: false
      matrix:
        deps: [pinned, latest]
    env:
      FEWSHOT_TEST_MODELS: "1"
      FEWSHOT_DEVICE: cpu
      FEWSHOT_MAX_MODELS: "1"
      CONSTRAINTS: ${{ matrix.deps == 'pinned' && '-c constraints.txt' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch; the SigLIP preset needs transformers)
        run: |
          pip install --no-deps $CONSTRAINTS torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install $CONSTRAINTS -e ".[dev,siglip]"
          pip list
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/huggingface
          # One cache per leg: both legs saving under one key would race, and only one would win.
          key: hf-${{ matrix.deps }}-${{ hashFiles('fewshot/embedders.py') }}
          restore-keys: |
            hf-${{ matrix.deps }}-
            hf-
      - name: pytest -m model (fails if the model tests were skipped)
        run: |
          set -o pipefail
          pytest -q -m model -rs tests/test_real_models.py | tee "$RUNNER_TEMP/pytest.log"
          if grep -q "skipped" "$RUNNER_TEMP/pytest.log"; then echo "::error::model tests were skipped"; exit 1; fi
