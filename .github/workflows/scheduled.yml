name: Scheduled

# Weekly, and on demand: the checks against the newest releases of every dependency (CI itself
# uses constraints.txt, so an upstream release can't turn it red), and smoke tests of real models.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the newest versions (no constraints)
        run: |
          pip install --no-deps torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip list
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy
      - name: pylint
        run: pylint --fail-under=10 fewshot tests
      - name: pytest
        run: pytest -q --cov --cov-report=term-missing

  real-models:
    # The opt-in @pytest.mark.model tests: the smallest preset embeds an image and a text for real.
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/../hf  # outside the checkout, where tests may not write
      FEWSHOT_TEST_MODELS: "1"
      FEWSHOT_DEVICE: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install (CPU-only torch)
        run: |
          pip install --no-deps -c constraints.txt torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints.txt -e ".[dev]"
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../hf
          key: hf-${{ hashFiles('tests/test_real_models.py') }}
          restore-keys: hf-
      - name: pytest -m model
        run: pytest -q -m model -rs tests/test_real_models.py
