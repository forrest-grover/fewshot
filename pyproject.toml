[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot"
version = "0.1.0"
description = "Embedding-based few-shot image classification: library, CLI, REST API and web UI"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "open_clip_torch",
    "timm",
    "numpy",
    "pillow",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "typer",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-cov", "coverage", "pylint"]

[project.scripts]
fewshot = "fewshot.cli:app"

[tool.setuptools.packages.find]
include = ["fewshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fewshot"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if __name__ == .__main__.:"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'tests')"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
# One- and two-character names are standard notation for embeddings and matrices (X, y, Q, P, k).
good-names-rgxs = ["^[_a-zA-Z][_a-zA-Z0-9]?$"]
