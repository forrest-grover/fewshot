[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot"
version = "0.1.0"
description = "Embedding-based few-shot image classification: library, CLI, REST API and web UI"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "open_clip_torch",
    "timm",
    "numpy",
    "pillow",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "typer",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
fewshot = "fewshot.cli:app"

[tool.setuptools.packages.find]
include = ["fewshot*"]
