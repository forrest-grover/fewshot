[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot"
version = "0.1.0"
description = "Embedding-based few-shot image classification: library, CLI, REST API and web UI"
requires-python = ">=3.12"  # what CI, Docker and constraints.txt use
dependencies = [
    "torch",
    "torchvision",
    "open_clip_torch>=3.0",  # the PE Core presets
    "timm>=1.0.17",  # what open_clip 3.0 needs
    "numpy",
    "pillow",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "typer",
    "pydantic>=2",
    "rich",  # progress bars in the CLI
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-cov", "coverage", "pylint", "ruff", "mypy", "packaging"]  # packaging: scripts/freeze_constraints.py
siglip = ["transformers"]  # tokenizer of the SigLIP 2 preset

[project.scripts]
fewshot = "fewshot.cli:main"

[tool.setuptools.packages.find]
include = ["fewshot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "model: loads a real model (downloads its weights); skipped unless FEWSHOT_TEST_MODELS=1",
    "posix_fs: exercises file locks, fsync, atomic renames or hard links; CI also runs these on macOS",
]

[tool.coverage.run]
source = ["fewshot"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if __name__ == .__main__.:"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.basic]
# One- and two-character names are standard notation for embeddings and matrices (X, y, Q, P, k).
good-names-rgxs = ["^[_a-zA-Z][_a-zA-Z0-9]?$"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]

[tool.ruff.lint.flake8-bugbear]
# Typer and FastAPI declare parameters with these calls in argument defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["fewshot", "tests"]

[[tool.mypy.overrides]]
# These ML libraries have no (or incomplete) type information; treat them as Any.
module = ["open_clip", "open_clip.*", "timm", "timm.*", "torchvision.*", "sklearn.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Tests: check bodies and calls, but don't require annotations on every test function and fixture.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
